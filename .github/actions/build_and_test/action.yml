name: 'Build and Test'
description: 'Build and test a package'
inputs:
  node-version:
    description: 'The version of node to use'
    required: true
  package_path:
    description: 'The current package path'
    required: true
  package_name:
    description: 'The current package name'
    required: true
  check:
    description: 'check the package'
    required: false
    default: "false"
  CODECOV_TOKEN:
    description: 'CODECOV_TOKEN'
    required: true
  GITHUB_TOKEN:
    description: 'GITHUB_TOKEN'
    required: true

runs:
  using: "composite"
  steps:
    - name: Install Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: ${{ inputs.node-version }}

    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      name: Install pnpm
      id: pnpm-install
      with:
        run_install: false

    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      name: Setup pnpm cache
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: run eslint
      run: npm run ci:eslint
      working-directory: ${{ inputs.package_path }}
      shell: bash
      env:
        CI: true
      if: ${{ inputs.check == 'true' }}

    - name: Test build
      run: pnpm -F ${{ inputs.package_name }}... build
      shell: bash

    - name: Run tests with coverage
      run: npm run test:ci:coverage -- --reporter=github-actions
      working-directory: ${{ inputs.package_path }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        CI: true

    - name: replace path in coverage files
      working-directory: ${{ inputs.package_path }}
      shell: bash
      run: |
        find ./coverage -type f -exec sed -i -e "s@$(pwd)@.@g" {} \;
      if: ${{ inputs.check == 'true' }}

    - name: Normalize node version for artifact name
      id: norm-node
      shell: bash
      run: |
        echo "safe=$(echo '${{ inputs.node-version }}' | tr -c 'A-Za-z0-9._-' '_')" >> "$GITHUB_OUTPUT"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: "coverage-${{ inputs.package_name }}-${{ steps.norm-node.outputs.safe }}"
        path: |
          ${{ inputs.package_path }}/coverage/clover.xml
          ${{ inputs.package_path }}/coverage/coverage-final.json
          ${{ inputs.package_path }}/coverage/lcov.info
          ${{ inputs.package_path }}/coverage/eslint-report.json
      if: ${{ inputs.check == 'true' }}


    - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
      with:
        token: ${{ inputs.CODECOV_TOKEN }}
        flags: ${{ inputs.package_name }}
        name: ${{ inputs.package_name }}
        verbose: true
        directory: ${{ inputs.package_path }}/coverage
      if: ${{ inputs.check == 'true' }}
