name: MCP HTTP E2E

on:
  pull_request:
    paths:
      - "packages/crowdsec-mcp/**"
      - "packages/crowdsec-client/**"
      - ".github/workflows/mcp-http-e2e.yml"
  push:
    branches: [main]
    paths:
      - "packages/crowdsec-mcp/**"
      - "packages/crowdsec-client/**"
      - ".github/workflows/mcp-http-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  http-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run HTTP MCP E2E
        run: bash packages/crowdsec-mcp/tests/e2e/http/run.sh

      - name: Cleanup
        if: always()
        run: docker compose -p crowdsec-mcp-e2e -f packages/crowdsec-mcp/tests/e2e/http/compose.yaml down -v --remove-orphans || true
