name: Release
on:
  release:
    types: [created]

jobs:
  ci:
    uses: ./.github/workflows/CI.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    permissions:
      checks: write
      actions: read
      contents: read
      security-events: write

  prepare:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          package-manager-cache: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        name: Install pnpm
        id: pnpm-install
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
          lookup-only: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  list-packages:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        name: Install pnpm
        id: pnpm-install
        with:
          run_install: false
      - id: set-matrix
        run: |
          MATRIX=$(pnpm -s m ls --depth -1 -F "./packages/**" --json | jq -c)
          export MATRIX
          echo "matrix=${MATRIX}" | tee -a "$GITHUB_OUTPUT"

  # This workflow contains a single job called "build"
  build:
    needs: [ prepare, ci, list-packages ]
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # do a matrix test with different node versions
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.list-packages.outputs.matrix) }}

    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        name: Install pnpm
        id: pnpm-install
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
          lookup-only: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        shell: bash

      - name: Compare npm with local (versions)
        id: package_version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const directory = process.env.CHECK_PATH.startsWith('/')
              ? process.env.CHECK_PATH
              : `${process.env.GITHUB_WORKSPACE}/${process.env.CHECK_PATH}`;
            const { name, version: localVersion } = JSON.parse(
              fs.readFileSync(`${directory}/package.json`, 'utf8')
            );
            let npmVersion = '0.0.0';
            try {
              const res = await fetch(`https://registry.npmjs.org/${name}`);
              if (res.ok) {
                const data = await res.json();
                npmVersion = data['dist-tags']?.latest || '0.0.0';
              }
            } catch (e) {
              console.log(`could not fetch ${name} from registry: ${e.message}`);
            }
            const compare = (a, b) => {
              const pa = a.split('.').map(Number);
              const pb = b.split('.').map(Number);
              for (let i = 0; i < 3; i++) {
                if ((pa[i] || 0) > (pb[i] || 0)) return 1;
                if ((pa[i] || 0) < (pb[i] || 0)) return -1;
              }
              return 0;
            };
            const npmIsGreater = compare(npmVersion, localVersion) >= 0;
            core.setOutput('version', localVersion);
            core.setOutput('pkg_npm_version', npmVersion);
            core.setOutput('npm_is_greater', String(npmIsGreater));
            console.log(`local ${name}@${localVersion} vs npm ${name}@${npmVersion} npm_is_greater=${npmIsGreater}`);
        env:
          CHECK_PATH: ${{ matrix.package.path }}

      - name: build dependencies
        run: pnpm -F ${{ matrix.package.name }}... build
        working-directory: ${{ matrix.package.path }}

      - name: publish to NPM
        run: |
          npm install --global npm@11.19.0 --ignore-scripts
          npm --version
          npm publish --provenance
        working-directory: ${{ matrix.package.path }}
        if: steps.package_version.outputs.npm_is_greater != 'true'

#      - name: publish to GPR
#        run: |
#          npx npe name @${{ github.repository_owner }}/${{ matrix.package.name }}
#
#          npm config set @${{ github.repository_owner }}:registry=https://npm.pkg.github.com
#          npm config set //https://npm.pkg.github.com:_authToken=${NODE_AUTH_TOKEN}
#          npm config set registry https://npm.pkg.github.com
#          npm config set scope ${{ github.repository_owner }}
#
#          pnpm publish --filter @${{ github.repository_owner }}/${{ matrix.package.name }} --no-git-checks
#        env:
#          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#        working-directory: ${{ matrix.package.path }}
#        if: steps.package_version.outputs.npm_is_greater != 'true'

  # Only build the Docker image once the matching version is actually published
  # on npm, so the image follows the same release flow as the npm package.
  docker-mcp-check:
    needs: [ build ]
    if: startsWith(github.event.release.tag_name, 'crowdsec-mcp/v')
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.check.outputs.published }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check npm publication
        id: check
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#crowdsec-mcp/v}"
          PUBLISHED=false
          for attempt in 1 2 3 4 5 6; do
            LATEST="$(curl -fsSL https://registry.npmjs.org/crowdsec-mcp | jq -r '.["dist-tags"].latest // "0.0.0"')" || LATEST=error
            echo "attempt ${attempt}: release=${VERSION} npm_latest=${LATEST}"
            if [ "${LATEST}" = "${VERSION}" ]; then PUBLISHED=true; break; fi
            sleep 10
          done
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "published=${PUBLISHED}" >> "$GITHUB_OUTPUT"

  docker-mcp:
    needs: [ docker-mcp-check ]
    if: needs['docker-mcp-check'].outputs.published == 'true'
    uses: ./.github/workflows/docker-mcp.yml
    with:
      version: ${{ needs['docker-mcp-check'].outputs.version }}
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
