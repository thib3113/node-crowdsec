name: Refresh Context7 Docs

# The library must first be added at https://context7.com/add-library
# and CONTEXT7_API_KEY must be set as a repository secret.
# To refresh automatically after that, add:
#   push:
#     branches: [ main ]
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Context7 refresh
        run: |
          curl --fail --silent --show-error -X POST https://context7.com/api/v1/refresh \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CONTEXT7_API_KEY }}" \
            -d '{"libraryName": "/${{ github.repository }}"}'
