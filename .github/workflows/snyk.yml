name: Snyk

# Snyk's free plan caps open source tests, so it is not run on every push or
# pull request. Free OSV-Scanner covers continuous SCA in CI.yml; Snyk is kept
# for the release gate and a weekly check. Callers:
#   - release.yml: blocks a release before anything is built or published.
#   - workflow_dispatch: pre-release check, run against main.
#   - schedule: catches a new advisory between two releases.
on:
  workflow_call:
    secrets:
      SNYK_TOKEN:
        required: true
  workflow_dispatch:
  schedule:
    # Weekly on main: one run per week instead of one per Renovate merge.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  snyk:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      # Required to upload the SARIF report to Code Scanning.
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@11b673cfb4b0dc0d860a1323caa199d54950dcce # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          # --all-projects scans each pnpm workspace project (one test per
          # lockfile). --production limits the gate to shipped components, so
          # an out-of-scope dev-only advisory cannot block a release
          # (docs/dependencies.md); --severity-threshold=high fails the job on
          # high and critical findings only.
          args: --sarif-file-output=snyk.sarif --all-projects --exclude=examples,dev --production --severity-threshold=high

      - name: Upload result to GitHub Code Scanning
        if: always() && hashFiles('snyk.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: snyk.sarif
          category: snyk
