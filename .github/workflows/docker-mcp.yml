name: Docker (crowdsec-mcp)

on:
  workflow_call:
    inputs:
      version:
        description: 'Released version (e.g. 0.0.4)'
        required: false
        type: string
        default: ''
  pull_request:
    paths:
      - 'packages/crowdsec-mcp/**'
      - 'packages/crowdsec-client/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.json'
      - '.npmrc'
      - '.github/workflows/docker-mcp.yml'
  # Publish on every merge on main (including Renovate dependency/base-image
  # bumps), so a merged digest update is actually built without waiting for a
  # release. `latest` therefore tracks the main branch; use a version tag for a
  # stable build.
  push:
    branches: [main]
    paths:
      - 'packages/crowdsec-mcp/**'
      - 'packages/crowdsec-client/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.json'
      - '.npmrc'
      - '.github/workflows/docker-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-crowdsec-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    # Empty on forks/PRs without the secrets: Docker Hub is then skipped.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Resolve image list
        id: images
        run: |
          {
            echo "list<<EOF"
            echo "ghcr.io/${{ github.repository_owner }}/crowdsec-mcp"
            if [ -n "$DOCKERHUB_USERNAME" ]; then
              echo "docker.io/thib3113/crowdsec-mcp"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' || inputs.version != '' }}
            type=sha,format=short,prefix=sha-
            type=match,pattern=^crowdsec-mcp/v(.*)$,group=1
            type=match,pattern=^v(.*)$,group=1

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packages/crowdsec-mcp/Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          pull: true
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=crowdsec-mcp
          cache-to: type=gha,mode=max,scope=crowdsec-mcp

      - name: Smoke test
        if: github.event_name == 'pull_request'
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: docker run --rm "$IMAGE" --version
