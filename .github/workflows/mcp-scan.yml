name: MCP security scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build MCP server
        run: pnpm -F crowdsec-mcp build

      - name: Create MCP config
        run: |
          cat > mcp.json <<'JSON'
          {
            "mcpServers": {
              "crowdsec": {
                "command": "node",
                "args": ["packages/crowdsec-mcp/dist/index.js"],
                "env": {
                  "CROWDSEC_URL": "http://127.0.0.1:8080",
                  "CROWDSEC_AUTH": "bouncer",
                  "CROWDSEC_API_KEY": "dummy"
                }
              }
            }
          }
          JSON

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Scan MCP server
        run: uvx snyk-agent-scan@latest scan mcp.json --ci --dangerously-run-mcp-servers --no-skills
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
