name: MCP security scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build MCP server
        run: pnpm -F crowdsec-mcp build

      - name: Create MCP config
        run: |
          cat > mcp.json <<'JSON'
          {
            "mcpServers": {
              "crowdsec": {
                "command": "node",
                "args": ["packages/crowdsec-mcp/dist/index.js"],
                "env": {
                  "CROWDSEC_URL": "http://127.0.0.1:8080",
                  "CROWDSEC_AUTH": "bouncer",
                  "CROWDSEC_API_KEY": "dummy"
                }
              }
            }
          }
          JSON

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Scan MCP server
        run: uvx --no-build snyk-agent-scan==0.6.9 scan mcp.json --ci --dangerously-run-mcp-servers --no-skills
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
